name: "CI"
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  parse-outputs:
    runs-on: nixos
    outputs:
      checks: ${{ steps.checks.outputs.checks }}
      tests: ${{ steps.tests.outputs.tests }}
      servers: ${{ steps.servers.outputs.servers }}
      workstations: ${{ steps.workstations.outputs.workstations }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Get checks
        id: checks
        run: |
          checks=$(nix eval .#checks.x86_64-linux --apply builtins.attrNames --json)
          printf 'checks=%s\n' "$checks" >> "$FORGEJO_OUTPUT"
      - name: Get tests
        id: tests
        run: |
          tests=$(nix eval .#tests.x86_64-linux --apply builtins.attrNames --json)
          printf 'tests=%s\n' "$tests" >> "$FORGEJO_OUTPUT"
      - name: Get servers
        id: servers
        run: |
          servers=$(nix eval .#nixosConfigurations --apply 'configs:
            configs
            |> builtins.attrNames
            |> builtins.filter (hostName: configs.${hostName}.config.custom.services.deploy-webhook.enable)
          ' --json)
          printf 'servers=%s\n' "$servers" >> "$FORGEJO_OUTPUT"
      - name: Get workstations
        id: workstations
        run: |
          workstations=$(nix eval .#nixosConfigurations --apply 'configs:
            configs
            |> builtins.attrNames
            |> builtins.filter (hostName: !configs.${hostName}.config.custom.services.deploy-webhook.enable)
          ' --json)
          printf 'workstations=%s\n' "$workstations" >> "$FORGEJO_OUTPUT"

  build-check:
    needs: parse-outputs
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.parse-outputs.outputs.checks) }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        uses: ./.forgejo/actions/build
        with:
          flake-output: .#checks.x86_64-linux.${{ matrix.check }}

  build-test:
    needs: parse-outputs
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.parse-outputs.outputs.tests) }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        uses: ./.forgejo/actions/build
        with:
          flake-output: .#tests.x86_64-linux.${{ matrix.test }}
      - name: Upload
        uses: ./.forgejo/actions/upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}

  build-server:
    needs: parse-outputs
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.parse-outputs.outputs.servers) }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        uses: ./.forgejo/actions/build
        with:
          flake-output: .#nixosConfigurations.${{ matrix.server }}.config.system.build.toplevel
      - name: Upload
        uses: ./.forgejo/actions/upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}

  collect-closure-paths:
    needs: parse-outputs
    runs-on: nixos
    outputs:
      paths: ${{ steps.paths.outputs.paths }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect current and expected closure paths
        id: paths
        env:
          SERVERS: ${{ needs.parse-outputs.outputs.servers }}
        run: |
          paths=$(nix eval --impure .#nixosConfigurations --apply 'configs:
            builtins.getEnv "SERVERS"
            |> builtins.fromJSON
            |> builtins.map (name: {
              inherit name;
              path = configs.${name}.config.system.build.toplevel.outPath;
              url = "https://${configs.${name}.config.networking.fqdn}/hooks/current-system";
            })
          ' --json | bash .forgejo/scripts/collect-closure-paths.sh)
          printf 'paths=%s\n' "$paths" >> "$FORGEJO_OUTPUT"

  closure-diff-report:
    needs: [collect-closure-paths, build-server]
    runs-on: nixos
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate closure diff report
        continue-on-error: true
        env:
          CLOSURE_PATHS: ${{ needs.collect-closure-paths.outputs.paths }}
          REPOSITORY: ${{ forgejo.repository }}
          COMMIT_SHA: ${{ forgejo.sha }}
          COMMIT_TITLE: ${{ forgejo.event.head_commit.message }}
          RUN_ID: ${{ forgejo.run_id }}
          RUN_NUMBER: ${{ forgejo.run_number }}
          EVENT_NAME: ${{ forgejo.event_name }}
        run: bash .forgejo/scripts/create-closure-diff-report.sh
      - name: Upload closure diff report
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: closure-diff-report
          path: closure-diff-report/report.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Verify closure diff report
        if: always()
        run: jq --exit-status '.result == "complete"' closure-diff-report/report.json >/dev/null

  deploy:
    if: >-
      always() &&
      needs.parse-outputs.result == 'success' &&
      needs.build-check.result == 'success' &&
      needs.build-test.result == 'success' &&
      needs.build-server.result == 'success' &&
      needs.collect-closure-paths.result == 'success'
    needs:
      [
        parse-outputs,
        build-check,
        build-test,
        build-server,
        collect-closure-paths,
      ]
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.parse-outputs.outputs.servers) }}
    steps:
      - name: Deploy
        timeout-minutes: 30
        env:
          URL: https://${{ matrix.server }}.splitleaf.de/hooks/deploy
        run: |
          for attempt in $(seq 1 10); do
            http_code=$(curl --silent --show-error --output response.txt --write-out '%{http_code}' --max-time 1800 "$URL" || echo 000)
            case "$http_code" in
              200) cat response.txt; exit 0 ;;
              500) cat response.txt; exit 1 ;;
              *)
                echo "Transient error (HTTP $http_code), retry $attempt/10"
                sleep 10
                ;;
            esac
          done
          echo "Max retries exceeded"
          exit 1

  notify:
    if: always()
    needs:
      [
        parse-outputs,
        build-check,
        build-test,
        build-server,
        collect-closure-paths,
        closure-diff-report,
        deploy,
      ]
    runs-on: nixos
    steps:
      - name: Notify
        env:
          PARSE_RESULT: ${{ needs.parse-outputs.result }}
          CHECK_RESULT: ${{ needs.build-check.result }}
          TEST_RESULT: ${{ needs.build-test.result }}
          SERVER_BUILD_RESULT: ${{ needs.build-server.result }}
          CLOSURE_PATHS_RESULT: ${{ needs.collect-closure-paths.result }}
          CLOSURE_DIFF_REPORT_RESULT: ${{ needs.closure-diff-report.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SHA: ${{ forgejo.sha }}
          COMMIT_MSG: ${{ forgejo.event.head_commit.message }}
        run: |
          for result in "$PARSE_RESULT" "$CHECK_RESULT" "$TEST_RESULT" "$SERVER_BUILD_RESULT" "$CLOSURE_PATHS_RESULT" "$CLOSURE_DIFF_REPORT_RESULT" "$DEPLOY_RESULT"; do
            if [[ "$result" == cancelled ]]; then
              exit 0
            fi
          done

          commit="${COMMIT_MSG%%$'\n'*}"
          if [[ "$PARSE_RESULT" != success || "$CHECK_RESULT" != success || "$TEST_RESULT" != success || "$SERVER_BUILD_RESULT" != success || "$CLOSURE_PATHS_RESULT" != success ]]; then
            title="CI: Failed"
            priority=low
            tags=rotating_light
            body=$(printf 'Commit `%s` failed CI before deployment.\n> %s' "${SHA::7}" "$commit")
          elif [[ "$DEPLOY_RESULT" != success ]]; then
            title="CI: Deployment failed"
            priority=low
            tags=rotating_light
            body=$(printf 'Commit `%s` failed to deploy.\n> %s' "${SHA::7}" "$commit")
          else
            title="CI: Deployment succeeded"
            priority=low
            tags=white_check_mark
            body=$(printf 'Commit `%s` deployed successfully.\n> %s' "${SHA::7}" "$commit")
          fi

          curl -s \
            -H "Title: $title" \
            -H "Priority: $priority" \
            -H "Tags: $tags" \
            -H "Actions: view, Open workflow run, ${{ forgejo.server_url }}/${{ forgejo.repository }}/actions/runs/${{ forgejo.run_number }}" \
            -H "Markdown: yes" \
            -d "$body" \
            https://ntfy.sh/splitleaf

  build-workstation:
    needs: [parse-outputs, notify]
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        workstation: ${{ fromJSON(needs.parse-outputs.outputs.workstations) }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        uses: ./.forgejo/actions/build
        with:
          flake-output: .#nixosConfigurations.${{ matrix.workstation }}.config.system.build.toplevel
      - name: Upload
        uses: ./.forgejo/actions/upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
