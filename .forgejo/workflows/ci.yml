name: "CI"
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  parse-outputs:
    runs-on: nixos
    outputs:
      checks: ${{ steps.checks.outputs.checks }}
      tests: ${{ steps.tests.outputs.tests }}
      servers_to_build: ${{ steps.servers-to-build.outputs.servers }}
      servers_to_deploy: ${{ steps.servers-to-deploy.outputs.servers }}
      workstations: ${{ steps.workstations.outputs.workstations }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Get checks
        id: checks
        run: |
          checks=$(nix eval .#checks.x86_64-linux --apply builtins.attrNames --json)
          printf 'checks=%s\n' "$checks" >> "$FORGEJO_OUTPUT"
      - name: Get uncached tests
        id: tests
        run: |
          tests=$(nix eval .#tests.x86_64-linux --apply 'outputs:
            outputs
            |> builtins.attrNames
            |> builtins.map (name: { inherit name; path = outputs.${name}.outPath; })
          ' --json | bash .forgejo/scripts/select-uncached-outputs.sh)
          if [[ "$tests" == '[]' ]]; then
            tests='["__no_test__"]'
          fi
          printf 'tests=%s\n' "$tests" >> "$FORGEJO_OUTPUT"
      - name: Get uncached servers
        id: servers-to-build
        run: |
          servers=$(nix eval .#nixosConfigurations --apply 'configs:
            configs
            |> builtins.attrNames
            |> builtins.filter (hostName: configs.${hostName}.config.custom.services.deploy-webhook.enable)
            |> builtins.map (name: { inherit name; path = configs.${name}.config.system.build.toplevel.outPath; })
          ' --json | bash .forgejo/scripts/select-uncached-outputs.sh)
          if [[ "$servers" == '[]' ]]; then
            servers='["__no_server__"]'
          fi
          printf 'servers=%s\n' "$servers" >> "$FORGEJO_OUTPUT"
      - name: Get servers requiring deployment
        id: servers-to-deploy
        run: |
          servers=$(nix eval .#nixosConfigurations --apply 'configs:
            configs
            |> builtins.attrNames
            |> builtins.filter (hostName: configs.${hostName}.config.custom.services.deploy-webhook.enable)
            |> builtins.map (name: {
              inherit name;
              path = configs.${name}.config.system.build.toplevel.outPath;
              url = "https://${configs.${name}.config.networking.fqdn}/hooks/current-system";
            })
          ' --json | bash .forgejo/scripts/select-hosts-to-deploy.sh)
          if [[ "$servers" == '[]' ]]; then
            servers='["__no_server__"]'
          fi
          printf 'servers=%s\n' "$servers" >> "$FORGEJO_OUTPUT"
      - name: Get uncached workstations
        id: workstations
        run: |
          workstations=$(nix eval .#nixosConfigurations --apply 'configs:
            configs
            |> builtins.attrNames
            |> builtins.filter (hostName: !configs.${hostName}.config.custom.services.deploy-webhook.enable)
            |> builtins.map (name: { inherit name; path = configs.${name}.config.system.build.toplevel.outPath; })
          ' --json | bash .forgejo/scripts/select-uncached-outputs.sh)
          if [[ "$workstations" == '[]' ]]; then
            workstations='["__no_workstation__"]'
          fi
          printf 'workstations=%s\n' "$workstations" >> "$FORGEJO_OUTPUT"

  build-check:
    needs: parse-outputs
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.parse-outputs.outputs.checks) }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        uses: ./.forgejo/actions/build
        with:
          flake-output: .#checks.x86_64-linux.${{ matrix.check }}

  build-test:
    if: needs.parse-outputs.outputs.tests != '["__no_test__"]'
    needs: parse-outputs
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.parse-outputs.outputs.tests) }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        uses: ./.forgejo/actions/build
        with:
          flake-output: .#tests.x86_64-linux.${{ matrix.test }}
      - name: Upload
        uses: ./.forgejo/actions/upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}

  build-server:
    if: needs.parse-outputs.outputs.servers_to_build != '["__no_server__"]'
    needs: parse-outputs
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.parse-outputs.outputs.servers_to_build) }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        uses: ./.forgejo/actions/build
        with:
          flake-output: .#nixosConfigurations.${{ matrix.server }}.config.system.build.toplevel
      - name: Upload
        uses: ./.forgejo/actions/upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}

  deploy:
    if: >-
      always() &&
      needs.parse-outputs.result == 'success' &&
      needs.parse-outputs.outputs.servers_to_deploy != '["__no_server__"]' &&
      needs.build-check.result == 'success' &&
      (needs.build-test.result == 'success' || needs.build-test.result == 'skipped') &&
      (needs.build-server.result == 'success' || needs.build-server.result == 'skipped')
    needs: [build-check, build-test, parse-outputs, build-server]
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.parse-outputs.outputs.servers_to_deploy) }}
    steps:
      - name: Deploy
        timeout-minutes: 30
        env:
          URL: https://${{ matrix.server }}.splitleaf.de/hooks/deploy
        run: |
          for attempt in $(seq 1 10); do
            http_code=$(curl --silent --show-error --output response.txt --write-out '%{http_code}' --max-time 1800 "$URL" || echo 000)
            case "$http_code" in
              200) cat response.txt; exit 0 ;;
              500) cat response.txt; exit 1 ;;
              *)
                echo "Transient error (HTTP $http_code), retry $attempt/10"
                sleep 10
                ;;
            esac
          done
          echo "Max retries exceeded"
          exit 1

  notify:
    if: always()
    needs: [parse-outputs, build-check, build-test, build-server, deploy]
    runs-on: nixos
    steps:
      - name: Notify
        env:
          PARSE_RESULT: ${{ needs.parse-outputs.result }}
          CHECK_RESULT: ${{ needs.build-check.result }}
          TEST_RESULT: ${{ needs.build-test.result }}
          SERVER_BUILD_RESULT: ${{ needs.build-server.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SERVERS: ${{ needs.parse-outputs.outputs.servers_to_deploy }}
          SHA: ${{ forgejo.sha }}
          COMMIT_MSG: ${{ forgejo.event.head_commit.message }}
        run: |
          for result in "$PARSE_RESULT" "$CHECK_RESULT" "$TEST_RESULT" "$SERVER_BUILD_RESULT" "$DEPLOY_RESULT"; do
            if [[ "$result" == cancelled ]]; then
              exit 0
            fi
          done

          succeeded_or_skipped() {
            [[ $1 == success || $1 == skipped ]]
          }

          commit="${COMMIT_MSG%%$'\n'*}"
          if [[ "$PARSE_RESULT" != success || "$CHECK_RESULT" != success ]] ||
            ! succeeded_or_skipped "$TEST_RESULT" ||
            ! succeeded_or_skipped "$SERVER_BUILD_RESULT"; then
            title="CI: Failed"
            priority=low
            tags=rotating_light
            body=$(printf 'Commit `%s` failed CI before deployment.\n> %s' "${SHA::7}" "$commit")
          elif [[ "$SERVERS" == '["__no_server__"]' ]]; then
            title="CI: No deployment required"
            priority=low
            tags=white_check_mark
            body=$(printf 'Commit `%s` passed CI; no servers required deployment.\n> %s' "${SHA::7}" "$commit")
          elif [[ "$DEPLOY_RESULT" != success ]]; then
            title="CI: Deployment failed"
            priority=low
            tags=rotating_light
            body=$(printf 'Commit `%s` failed to deploy.\n> %s' "${SHA::7}" "$commit")
          else
            title="CI: Deployment succeeded"
            priority=low
            tags=white_check_mark
            body=$(printf 'Commit `%s` deployed successfully.\n> %s' "${SHA::7}" "$commit")
          fi

          curl -s \
            -H "Title: $title" \
            -H "Priority: $priority" \
            -H "Tags: $tags" \
            -H "Actions: view, Open workflow run, ${{ forgejo.server_url }}/${{ forgejo.repository }}/actions/runs/${{ forgejo.run_number }}" \
            -H "Markdown: yes" \
            -d "$body" \
            https://ntfy.sh/splitleaf

  build-workstation:
    if: needs.parse-outputs.outputs.workstations != '["__no_workstation__"]'
    needs: [parse-outputs, notify]
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        workstation: ${{ fromJSON(needs.parse-outputs.outputs.workstations) }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        uses: ./.forgejo/actions/build
        with:
          flake-output: .#nixosConfigurations.${{ matrix.workstation }}.config.system.build.toplevel
      - name: Upload
        uses: ./.forgejo/actions/upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
