name: "CI"
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  discover-checks:
    runs-on: nixos
    outputs:
      checks_to_build: ${{ steps.checks.outputs.checks_to_build }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Get checks
        id: checks
        run: |
          checks=$(nix eval .#checks.x86_64-linux --apply builtins.attrNames --json)
          if [[ "$checks" == '[]' ]]; then
            checks='["__no_check__"]'
          fi
          printf 'checks_to_build=%s\n' "$checks" >> "$FORGEJO_OUTPUT"

  discover-tests:
    runs-on: nixos
    outputs:
      tests_to_build: ${{ steps.tests.outputs.tests_to_build }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Get uncached tests
        id: tests
        run: |
          tests=$(nix eval .#tests.x86_64-linux --apply 'outputs:
            outputs
            |> builtins.attrNames
            |> builtins.map (name: { inherit name; path = outputs.${name}.outPath; })
          ' --json | bash .forgejo/scripts/select-uncached-outputs.sh)
          if [[ "$tests" == '[]' ]]; then
            tests='["__no_test__"]'
          fi
          printf 'tests_to_build=%s\n' "$tests" >> "$FORGEJO_OUTPUT"

  discover-servers:
    runs-on: nixos
    outputs:
      server_inventory: ${{ steps.servers.outputs.server_inventory }}
      servers_to_build: ${{ steps.servers.outputs.servers_to_build }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Get servers and uncached outputs
        id: servers
        run: |
          server_inventory=$(nix eval .#nixosConfigurations --apply 'configs:
            configs
            |> builtins.attrNames
            |> builtins.filter (name: configs.${name}.config.custom.services.deploy-webhook.enable)
            |> builtins.map (name: {
              inherit name;
              expected_closure = configs.${name}.config.system.build.toplevel.outPath;
              current_closure_url = "https://${configs.${name}.config.networking.fqdn}/hooks/current-system";
            })
          ' --json)
          servers_to_build=$(bash .forgejo/scripts/select-uncached-outputs.sh <<< "$server_inventory")
          if [[ "$servers_to_build" == '[]' ]]; then
            servers_to_build='["__no_server__"]'
          fi
          printf 'server_inventory=%s\n' "$server_inventory" >> "$FORGEJO_OUTPUT"
          printf 'servers_to_build=%s\n' "$servers_to_build" >> "$FORGEJO_OUTPUT"

  discover-workstations:
    runs-on: nixos
    outputs:
      workstations_to_build: ${{ steps.workstations.outputs.workstations_to_build }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Get uncached workstations
        id: workstations
        run: |
          workstations=$(nix eval .#nixosConfigurations --apply 'configs:
            configs
            |> builtins.attrNames
            |> builtins.filter (name: !configs.${name}.config.custom.services.deploy-webhook.enable)
            |> builtins.map (name: { inherit name; path = configs.${name}.config.system.build.toplevel.outPath; })
          ' --json | bash .forgejo/scripts/select-uncached-outputs.sh)
          if [[ "$workstations" == '[]' ]]; then
            workstations='["__no_workstation__"]'
          fi
          printf 'workstations_to_build=%s\n' "$workstations" >> "$FORGEJO_OUTPUT"

  discover-deployments:
    needs: discover-servers
    runs-on: nixos
    outputs:
      closure_paths: ${{ steps.deployments.outputs.closure_paths }}
      servers_to_deploy: ${{ steps.deployments.outputs.servers_to_deploy }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Get servers requiring deployment
        id: deployments
        env:
          SERVER_INVENTORY: ${{ needs.discover-servers.outputs.server_inventory }}
        run: |
          closure_paths=$(bash .forgejo/scripts/collect-closure-paths.sh <<< "$SERVER_INVENTORY")
          servers_to_deploy=$(jq --compact-output '[
            .[]
            | select(.current_closure != .expected_closure)
            | .host
          ]' <<< "$closure_paths")
          if [[ "$servers_to_deploy" == '[]' ]]; then
            servers_to_deploy='["__no_server__"]'
          fi
          printf 'closure_paths=%s\n' "$closure_paths" >> "$FORGEJO_OUTPUT"
          printf 'servers_to_deploy=%s\n' "$servers_to_deploy" >> "$FORGEJO_OUTPUT"

  build-check:
    if: needs.discover-checks.outputs.checks_to_build != '["__no_check__"]'
    needs: discover-checks
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.discover-checks.outputs.checks_to_build) }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        uses: ./.forgejo/actions/build
        with:
          flake-output: .#checks.x86_64-linux.${{ matrix.check }}

  build-test:
    if: needs.discover-tests.outputs.tests_to_build != '["__no_test__"]'
    needs: discover-tests
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-tests.outputs.tests_to_build) }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        uses: ./.forgejo/actions/build
        with:
          flake-output: .#tests.x86_64-linux.${{ matrix.test }}
      - name: Upload
        uses: ./.forgejo/actions/upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}

  build-server:
    if: needs.discover-servers.outputs.servers_to_build != '["__no_server__"]'
    needs: discover-servers
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.discover-servers.outputs.servers_to_build) }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        uses: ./.forgejo/actions/build
        with:
          flake-output: .#nixosConfigurations.${{ matrix.server }}.config.system.build.toplevel
      - name: Upload
        uses: ./.forgejo/actions/upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}

  closure-diff-report:
    if: >-
      always() &&
      needs.discover-deployments.result == 'success'
    needs: [discover-deployments, build-server]
    runs-on: nixos
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate closure diff report
        continue-on-error: true
        env:
          CLOSURE_PATHS: ${{ needs.discover-deployments.outputs.closure_paths }}
          REPOSITORY: ${{ forgejo.repository }}
          COMMIT_SHA: ${{ forgejo.sha }}
          COMMIT_TITLE: ${{ forgejo.event.head_commit.message }}
          RUN_ID: ${{ forgejo.run_id }}
          RUN_NUMBER: ${{ forgejo.run_number }}
          EVENT_NAME: ${{ forgejo.event_name }}
        run: bash .forgejo/scripts/create-closure-diff-report.sh
      - name: Upload closure diff report
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: closure-diff-report
          path: closure-diff-report/report.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Verify closure diff report
        if: always()
        run: jq --exit-status '.result == "complete"' closure-diff-report/report.json >/dev/null

  deploy:
    if: >-
      always() &&
      needs.discover-checks.result == 'success' &&
      needs.discover-tests.result == 'success' &&
      needs.discover-servers.result == 'success' &&
      needs.discover-workstations.result == 'success' &&
      needs.discover-deployments.result == 'success' &&
      needs.discover-deployments.outputs.servers_to_deploy != '["__no_server__"]' &&
      (needs.build-check.result == 'success' || needs.build-check.result == 'skipped') &&
      (needs.build-test.result == 'success' || needs.build-test.result == 'skipped') &&
      (needs.build-server.result == 'success' || needs.build-server.result == 'skipped')
    needs:
      [
        discover-checks,
        discover-tests,
        discover-servers,
        discover-workstations,
        discover-deployments,
        build-check,
        build-test,
        build-server,
      ]
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.discover-deployments.outputs.servers_to_deploy) }}
    steps:
      - name: Deploy
        timeout-minutes: 30
        env:
          URL: https://${{ matrix.server }}.splitleaf.de/hooks/deploy
        run: |
          for attempt in $(seq 1 10); do
            http_code=$(curl --silent --show-error --output response.txt --write-out '%{http_code}' --max-time 1800 "$URL" || echo 000)
            case "$http_code" in
              200) cat response.txt; exit 0 ;;
              500) cat response.txt; exit 1 ;;
              *)
                echo "Transient error (HTTP $http_code), retry $attempt/10"
                sleep 10
                ;;
            esac
          done
          echo "Max retries exceeded"
          exit 1

  notify:
    if: always()
    needs:
      [
        discover-checks,
        discover-tests,
        discover-servers,
        discover-workstations,
        discover-deployments,
        build-check,
        build-test,
        build-server,
        closure-diff-report,
        deploy,
      ]
    runs-on: nixos
    steps:
      - name: Notify
        env:
          CHECK_DISCOVERY_RESULT: ${{ needs.discover-checks.result }}
          TEST_DISCOVERY_RESULT: ${{ needs.discover-tests.result }}
          SERVER_DISCOVERY_RESULT: ${{ needs.discover-servers.result }}
          WORKSTATION_DISCOVERY_RESULT: ${{ needs.discover-workstations.result }}
          DEPLOYMENT_DISCOVERY_RESULT: ${{ needs.discover-deployments.result }}
          CHECK_RESULT: ${{ needs.build-check.result }}
          TEST_RESULT: ${{ needs.build-test.result }}
          SERVER_BUILD_RESULT: ${{ needs.build-server.result }}
          CLOSURE_DIFF_REPORT_RESULT: ${{ needs.closure-diff-report.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SERVERS_TO_DEPLOY: ${{ needs.discover-deployments.outputs.servers_to_deploy }}
          SHA: ${{ forgejo.sha }}
          COMMIT_MSG: ${{ forgejo.event.head_commit.message }}
        run: |
          for result in "$CHECK_DISCOVERY_RESULT" "$TEST_DISCOVERY_RESULT" "$SERVER_DISCOVERY_RESULT" "$WORKSTATION_DISCOVERY_RESULT" "$DEPLOYMENT_DISCOVERY_RESULT" "$CHECK_RESULT" "$TEST_RESULT" "$SERVER_BUILD_RESULT" "$CLOSURE_DIFF_REPORT_RESULT" "$DEPLOY_RESULT"; do
            if [[ "$result" == cancelled ]]; then
              exit 0
            fi
          done

          succeeded_or_skipped() {
            [[ $1 == success || $1 == skipped ]]
          }

          commit="${COMMIT_MSG%%$'\n'*}"
          if [[ "$CHECK_DISCOVERY_RESULT" != success || "$TEST_DISCOVERY_RESULT" != success || "$SERVER_DISCOVERY_RESULT" != success || "$WORKSTATION_DISCOVERY_RESULT" != success || "$DEPLOYMENT_DISCOVERY_RESULT" != success ]] ||
            ! succeeded_or_skipped "$CHECK_RESULT" ||
            ! succeeded_or_skipped "$TEST_RESULT" ||
            ! succeeded_or_skipped "$SERVER_BUILD_RESULT"; then
            title="CI: Failed"
            priority=low
            tags=rotating_light
            body=$(printf 'Commit `%s` failed CI before deployment.\n> %s' "${SHA::7}" "$commit")
          elif [[ "$SERVERS_TO_DEPLOY" == '["__no_server__"]' ]]; then
            title="CI: No deployment required"
            priority=low
            tags=white_check_mark
            body=$(printf 'Commit `%s` passed CI; no servers required deployment.\n> %s' "${SHA::7}" "$commit")
          elif [[ "$DEPLOY_RESULT" != success ]]; then
            title="CI: Deployment failed"
            priority=low
            tags=rotating_light
            body=$(printf 'Commit `%s` failed to deploy.\n> %s' "${SHA::7}" "$commit")
          else
            title="CI: Deployment succeeded"
            priority=low
            tags=white_check_mark
            body=$(printf 'Commit `%s` deployed successfully.\n> %s' "${SHA::7}" "$commit")
          fi

          curl -s \
            -H "Title: $title" \
            -H "Priority: $priority" \
            -H "Tags: $tags" \
            -H "Actions: view, Open workflow run, ${{ forgejo.server_url }}/${{ forgejo.repository }}/actions/runs/${{ forgejo.run_number }}" \
            -H "Markdown: yes" \
            -d "$body" \
            https://ntfy.sh/splitleaf

  build-workstation:
    if: needs.discover-workstations.outputs.workstations_to_build != '["__no_workstation__"]'
    needs: discover-workstations
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        workstation: ${{ fromJSON(needs.discover-workstations.outputs.workstations_to_build) }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        uses: ./.forgejo/actions/build
        with:
          flake-output: .#nixosConfigurations.${{ matrix.workstation }}.config.system.build.toplevel
      - name: Upload
        uses: ./.forgejo/actions/upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
