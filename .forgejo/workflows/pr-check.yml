name: "PR Check"
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  discover-checks:
    runs-on: nixos
    outputs:
      checks_to_build: ${{ steps.checks.outputs.checks_to_build }}
      checks_to_cache: ${{ steps.checks.outputs.checks_to_cache }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Get checks
        id: checks
        run: |
          checks=$(nix eval .#checks.x86_64-linux --apply 'outputs:
            outputs
            |> builtins.attrNames
            |> builtins.filter (name: builtins.elem "ci" outputs.${name}.runsOn)
            |> builtins.map (name: {
              inherit name;
              path = outputs.${name}.outPath;
              inherit (outputs.${name}) cache;
            })
          ' --json | bash .forgejo/scripts/select-uncached-outputs.sh)
          checks_to_build=$(jq --compact-output 'map(.name)' <<< "$checks")
          checks_to_cache=$(jq --compact-output 'map(select(.cache) | .name)' <<< "$checks")
          printf 'checks_to_build=%s\n' "$checks_to_build" >> "$FORGEJO_OUTPUT"
          printf 'checks_to_cache=%s\n' "$checks_to_cache" >> "$FORGEJO_OUTPUT"

  build-check:
    needs: discover-checks
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.discover-checks.outputs.checks_to_build) }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        uses: ./.forgejo/actions/build
        with:
          flake-output: .#checks.x86_64-linux.${{ matrix.check }}
      - name: Upload
        if: contains(fromJSON(needs.discover-checks.outputs.checks_to_cache), matrix.check)
        uses: ./.forgejo/actions/upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}

  closure-diff-report:
    if: >-
      forgejo.event.pull_request.head.repo.full_name == forgejo.repository &&
      startsWith(forgejo.event.pull_request.head.ref, 'renovate/')
    needs: [discover-checks, build-check]
    runs-on: nixos
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate closure diff report
        env:
          BASE_SHA: ${{ forgejo.event.pull_request.base.sha }}
          HEAD_SHA: ${{ forgejo.event.pull_request.head.sha }}
          FLAKE_URL: git+${{ forgejo.server_url }}/${{ forgejo.repository }}
        run: bash .forgejo/scripts/create-closure-diff-report.sh
      - name: Upload closure diff report
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: closure-diff-report
          path: closure-diff-report/report.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  merge-gate:
    if: always()
    needs: [discover-checks, build-check, closure-diff-report]
    runs-on: nixos
    steps:
      - name: Verify PR checks passed
        env:
          BUILD_CHECK_RESULT: ${{ needs.build-check.result }}
          CLOSURE_DIFF_REPORT_RESULT: ${{ needs.closure-diff-report.result }}
        run: |
          if [[ "$BUILD_CHECK_RESULT" != "success" || ( "$CLOSURE_DIFF_REPORT_RESULT" != "success" && "$CLOSURE_DIFF_REPORT_RESULT" != "skipped" ) ]]; then
            echo "Build results: checks=$BUILD_CHECK_RESULT closure-diff-report=$CLOSURE_DIFF_REPORT_RESULT" >&2
            exit 1
          fi
