name: "PR Checks"
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  validate-trigger:
    runs-on: nixos
    steps:
      - name: Verify allowed trigger
        env:
          EVENT_NAME: ${{ forgejo.event_name }}
          BASE_REF: ${{ forgejo.event.pull_request.base.ref }}
          HEAD_REPO: ${{ forgejo.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ forgejo.event.pull_request.head.ref }}
          REPOSITORY: ${{ forgejo.repository }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            exit 0
          fi

          if [[ "$BASE_REF" == "main" && "$HEAD_REPO" == "$REPOSITORY" && "$HEAD_REF" == renovate/* ]]; then
            exit 0
          fi

          echo "PR Checks only run automatically for Renovate PRs targeting main from this repository, or by manual dispatch." >&2
          exit 1

  parse-outputs:
    needs: validate-trigger
    runs-on: nixos
    outputs:
      checks: ${{ steps.checks.outputs.checks }}
      tests: ${{ steps.tests.outputs.tests }}
      servers: ${{ steps.servers.outputs.servers }}
      workstations: ${{ steps.workstations.outputs.workstations }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Get checks
        id: checks
        run: |
          checks=$(nix eval .#checks.x86_64-linux --apply builtins.attrNames --json)
          printf "checks=%s" "$checks" >> "$FORGEJO_OUTPUT"
      - name: Get tests
        id: tests
        run: |
          tests=$(nix eval .#tests.x86_64-linux --apply builtins.attrNames --json)
          printf "tests=%s" "$tests" >> "$FORGEJO_OUTPUT"
      - name: Get servers
        id: servers
        run: |
          servers=$(nix eval .#nixosConfigurations --apply 'configs:
            configs
            |> builtins.attrNames
            |> builtins.filter (hostName: configs.${hostName}.config.custom.services.deploy-webhook.enable)
          ' --json)
          printf "servers=%s" "$servers" >> "$FORGEJO_OUTPUT"
      - name: Get workstations
        id: workstations
        run: |
          workstations=$(nix eval .#nixosConfigurations --apply 'configs:
            configs
            |> builtins.attrNames
            |> builtins.filter (hostName: !configs.${hostName}.config.custom.services.deploy-webhook.enable)
          ' --json)
          printf "workstations=%s" "$workstations" >> "$FORGEJO_OUTPUT"

  build-check:
    needs: parse-outputs
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.parse-outputs.outputs.checks) }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        uses: ./.forgejo/actions/build
        with:
          flake-output: .#checks.x86_64-linux.${{ matrix.check }}

  build-test:
    needs: parse-outputs
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.parse-outputs.outputs.tests) }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        uses: ./.forgejo/actions/build
        with:
          flake-output: .#tests.x86_64-linux.${{ matrix.test }}

  build-server:
    needs: parse-outputs
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.parse-outputs.outputs.servers) }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        uses: ./.forgejo/actions/build
        with:
          flake-output: .#nixosConfigurations.${{ matrix.server }}.config.system.build.toplevel

  build-workstation:
    needs: parse-outputs
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        workstation: ${{ fromJSON(needs.parse-outputs.outputs.workstations) }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        uses: ./.forgejo/actions/build
        with:
          flake-output: .#nixosConfigurations.${{ matrix.workstation }}.config.system.build.toplevel

  merge-gate:
    if: always()
    needs: [build-check, build-test, build-server, build-workstation]
    runs-on: nixos
    steps:
      - name: Verify PR checks passed
        env:
          BUILD_CHECK_RESULT: ${{ needs.build-check.result }}
          BUILD_TEST_RESULT: ${{ needs.build-test.result }}
          BUILD_SERVER_RESULT: ${{ needs.build-server.result }}
          BUILD_WORKSTATION_RESULT: ${{ needs.build-workstation.result }}
        run: |
          if [[ "$BUILD_CHECK_RESULT" != "success" || "$BUILD_TEST_RESULT" != "success" || "$BUILD_SERVER_RESULT" != "success" || "$BUILD_WORKSTATION_RESULT" != "success" ]]; then
            echo "Build results: checks=$BUILD_CHECK_RESULT tests=$BUILD_TEST_RESULT servers=$BUILD_SERVER_RESULT workstations=$BUILD_WORKSTATION_RESULT" >&2
            exit 1
          fi
