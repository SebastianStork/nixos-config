name: "Renovate Check"
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  parse-outputs:
    if: >-
      forgejo.event.pull_request.head.repo.full_name == forgejo.repository &&
      startsWith(forgejo.event.pull_request.head.ref, 'renovate/') &&
      forgejo.event.pull_request.user.login == 'SebastianStork-Bot'
    runs-on: nixos
    outputs:
      checks: ${{ steps.checks.outputs.checks }}
      tests: ${{ steps.tests.outputs.tests }}
      hosts: ${{ steps.hosts.outputs.hosts }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Get checks
        id: checks
        run: |
          checks=$(nix eval .#checks.x86_64-linux --apply builtins.attrNames --json)
          printf "checks=%s" "$checks" >> "$FORGEJO_OUTPUT"
      - name: Get tests
        id: tests
        run: |
          tests=$(nix eval .#tests.x86_64-linux --apply builtins.attrNames --json)
          printf "tests=%s" "$tests" >> "$FORGEJO_OUTPUT"
      - name: Get hosts
        id: hosts
        run: |
          hosts=$(nix eval .#nixosConfigurations --apply builtins.attrNames --json)
          printf "hosts=%s" "$hosts" >> "$FORGEJO_OUTPUT"

  build-check:
    needs: parse-outputs
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.parse-outputs.outputs.checks) }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        uses: ./.forgejo/actions/build
        with:
          flake-output: .#checks.x86_64-linux.${{ matrix.check }}

  build-test:
    needs: parse-outputs
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.parse-outputs.outputs.tests) }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        uses: ./.forgejo/actions/build
        with:
          flake-output: .#tests.x86_64-linux.${{ matrix.test }}

  build-host:
    needs: parse-outputs
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.parse-outputs.outputs.hosts) }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        uses: ./.forgejo/actions/build
        with:
          flake-output: .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel

  closure-diff-report:
    needs: build-host
    runs-on: nixos
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate closure diff report
        env:
          BASE_SHA: ${{ forgejo.event.pull_request.base.sha }}
          HEAD_SHA: ${{ forgejo.event.pull_request.head.sha }}
          FLAKE_URL: git+${{ forgejo.server_url }}/${{ forgejo.repository }}
        run: bash .forgejo/scripts/create-closure-diff-report.sh
      - name: Upload closure diff report
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: closure-diff-report
          path: closure-diff-report/report.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  merge-gate:
    if: >-
      always() &&
      needs.parse-outputs.result != 'skipped'
    needs:
      [parse-outputs, build-check, build-test, build-host, closure-diff-report]
    runs-on: nixos
    steps:
      - name: Verify PR checks passed
        env:
          BUILD_CHECK_RESULT: ${{ needs.build-check.result }}
          BUILD_TEST_RESULT: ${{ needs.build-test.result }}
          BUILD_HOST_RESULT: ${{ needs.build-host.result }}
          CLOSURE_DIFF_REPORT_RESULT: ${{ needs.closure-diff-report.result }}
        run: |
          if [[ "$BUILD_CHECK_RESULT" != "success" || "$BUILD_TEST_RESULT" != "success" || "$BUILD_HOST_RESULT" != "success" || "$CLOSURE_DIFF_REPORT_RESULT" != "success" ]]; then
            echo "Build results: checks=$BUILD_CHECK_RESULT tests=$BUILD_TEST_RESULT hosts=$BUILD_HOST_RESULT closure-diff-report=$CLOSURE_DIFF_REPORT_RESULT" >&2
            exit 1
          fi
